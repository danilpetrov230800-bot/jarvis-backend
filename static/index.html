<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova · персональный ИИ-ассистент</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="orb" id="orb">
            <span class="orb-core"></span>
            <span class="orb-ring"></span>
          </div>
          <div class="brand-text">
            <h1>NOVA</h1>
            <p class="tagline">персональный ИИ-ассистент</p>
          </div>
        </div>
        <div class="status" id="status">
          <span class="dot"></span>
          <span class="status-label" id="statusLabel">подключение…</span>
        </div>
        <div class="topbar-actions">
          <button id="ttsBtn" class="icon-btn" title="Озвучивать ответы" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          </button>
          <button id="clearBtn" class="icon-btn" title="Новый диалог">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 7h12v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7zm3-3h6l1 2H8l1-2z"/></svg>
          </button>
        </div>
      </header>

      <main class="chat" id="chat">
        <section class="welcome" id="welcome">
          <div class="welcome-orb">
            <span></span><span></span><span></span>
          </div>
          <h2>Привет, я Nova.</h2>
          <p>Спроси меня о чём угодно — помогу с кодом, идеями и планами.</p>
          <div class="suggestions" id="suggestions">
            <button class="chip">Придумай план на день</button>
            <button class="chip">Объясни, как работают нейросети</button>
            <button class="chip">Напиши функцию сортировки на Python</button>
            <button class="chip">Дай идеи для стартапа</button>
          </div>
        </section>
      </main>

      <footer class="composer">
        <div class="composer-inner">
          <button id="micBtn" class="icon-btn mic" title="Голосовой ввод">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
          </button>
          <textarea
            id="input"
            rows="1"
            placeholder="Сообщение для Nova…"
            autocomplete="off"
          ></textarea>
          <button id="sendBtn" class="send-btn" title="Отправить" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 20.5v-6l8-2.5-8-2.5v-6l19 8.5z"/></svg>
          </button>
        </div>
        <p class="hint" id="hint">Enter — отправить · Shift+Enter — новая строка</p>
      </footer>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
