name: windows-package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          "$env:ProgramFiles(x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build self-contained Windows installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build-windows.ps1
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-release
          path: release
          if-no-files-found: error
